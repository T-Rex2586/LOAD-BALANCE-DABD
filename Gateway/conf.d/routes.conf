server {
    listen 80;
    server_name _;

    set $jwt_sub "";
    set $jwt_role "";

    client_max_body_size 1m;
    client_body_buffer_size 128k;

    limit_req zone=per_key burst=40 nodelay;
    limit_req_status 429;
    limit_conn conn_per_key 20;
    limit_conn_status 429;

    access_log /dev/stdout gateway_json;

    log_by_lua_block {
        require("logging").log()
    }

    location = /_gateway/health {
        access_log off;
        default_type application/json;
        add_header X-Request-Id $request_id always;
        return 200 '{"status":"ok"}';
    }

    location = /_gateway/status {
        content_by_lua_block {
            require("status").serve()
        }
    }

    location /_gateway/ {
        return 404;
    }

    location / {
        access_by_lua_block {
            require("gateway").access()
        }

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 1s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;

        proxy_intercept_errors on;
        error_page 408 413 429 500 502 503 504 @json_error;

        add_header X-Request-Id $request_id always;
        add_header X-Upstream-Addr $upstream_addr always;
    }

    location @json_error {
        internal;
        content_by_lua_block {
            require("gateway").error_page()
        }
        add_header X-Request-Id $request_id always;
    }
}
